<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Split the Bill</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #1c2321;
    --muted: #6b7571;
    --line: #e4e0d6;
    --accent: #0f766e;
    --accent-ink: #ffffff;
    --accent-soft: #d9efec;
    --result-bg: #0f766e;
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121715;
      --card: #1b2220;
      --ink: #eef2f0;
      --muted: #94a09b;
      --line: #2c3532;
      --accent: #2dd4bf;
      --accent-ink: #06201c;
      --accent-soft: #17332f;
      --result-bg: #0f3d38;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 440px; }
  h1 { font-size: 1.5rem; margin: 4px 0 2px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 0.95rem; margin: 0 0 18px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
  }
  label, .label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .field + .field { margin-top: 20px; }
  .money {
    display: flex;
    align-items: center;
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 0 14px;
    background: var(--bg);
    transition: border-color .15s;
  }
  .money:focus-within { border-color: var(--accent); }
  .money span { font-size: 1.6rem; color: var(--muted); margin-right: 6px; }
  .money input {
    flex: 1; min-width: 0;
    border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 1.8rem; font-weight: 600;
    color: var(--ink);
    padding: 12px 0;
  }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .chip {
    appearance: none;
    border: 2px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font: inherit; font-weight: 600; font-size: 1rem;
    padding: 12px 0;
    border-radius: 12px;
    cursor: pointer;
    min-height: 48px;
    transition: all .12s;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .custom-wrap { display: none; margin-top: 10px; }
  .custom-wrap.show { display: block; }
  .custom-wrap .money input { font-size: 1.3rem; padding: 10px 0; }
  .custom-wrap .money span { font-size: 1.2rem; margin: 0 0 0 6px; }
  .stepper { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .stepper button {
    appearance: none;
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font-size: 1.6rem; line-height: 1;
    cursor: pointer;
  }
  .stepper button:active { background: var(--accent-soft); }
  .stepper input {
    width: 90px; text-align: center;
    border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 2rem; font-weight: 700; color: var(--ink);
  }
  .result {
    background: var(--result-bg);
    color: #fff;
    border-radius: var(--radius);
    padding: 22px 18px;
    text-align: center;
  }
  .result .small { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: .8; }
  .per-person { font-size: 2.8rem; font-weight: 700; margin: 4px 0 2px; letter-spacing: -0.02em; word-break: break-word; }
  .per-note { font-size: .9rem; opacity: .8; min-height: 1.2em; }
  dl { margin: 16px 0 0; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.22); }
  .row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 1rem; }
  .row dt { opacity: .85; }
  .row dd { margin: 0; font-weight: 600; }
  .row.total { font-size: 1.1rem; margin-top: 4px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.22); }
  .reset {
    display: block; margin: 14px auto 0;
    background: none; border: 0; color: var(--muted);
    font: inherit; font-size: .9rem; text-decoration: underline; cursor: pointer; padding: 8px;
  }
  .hint { color: var(--muted); font-size: .8rem; text-align: center; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>Split the Bill</h1>
  <p class="sub">Tip and share, worked out in rupees.</p>

  <section class="card">
    <div class="field">
      <label for="bill">Bill amount</label>
      <div class="money">
        <span>₹</span>
        <input id="bill" type="text" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Bill amount in rupees">
      </div>
    </div>

    <div class="field">
      <div class="label" id="tipLabel">Tip</div>
      <div class="chips" role="group" aria-labelledby="tipLabel">
        <button class="chip" data-tip="0" aria-pressed="false">0%</button>
        <button class="chip" data-tip="5" aria-pressed="true">5%</button>
        <button class="chip" data-tip="10" aria-pressed="false">10%</button>
        <button class="chip" data-tip="custom" aria-pressed="false">Custom</button>
      </div>
      <div class="custom-wrap" id="customWrap">
        <div class="money">
          <input id="customTip" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 7.5" aria-label="Custom tip percentage">
          <span>%</span>
        </div>
      </div>
    </div>

    <div class="field">
      <div class="label">Number of people</div>
      <div class="stepper">
        <button id="minus" aria-label="Fewer people">−</button>
        <input id="people" type="text" inputmode="numeric" value="2" aria-label="Number of people">
        <button id="plus" aria-label="More people">+</button>
      </div>
    </div>
  </section>

  <section class="result" aria-live="polite">
    <div class="small">Each person pays</div>
    <div class="per-person" id="perPerson">₹0.00</div>
    <div class="per-note" id="perNote"></div>
    <dl>
      <div class="row"><dt>Bill</dt><dd id="outBill">₹0.00</dd></div>
      <div class="row"><dt id="tipName">Tip</dt><dd id="outTip">₹0.00</dd></div>
      <div class="row total"><dt>Total</dt><dd id="outTotal">₹0.00</dd></div>
    </dl>
  </section>

  <button class="reset" id="reset">Reset</button>
  <p class="hint">GST and service charge already on your bill? Enter the final printed amount.</p>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var bill = $('bill'), custom = $('customTip'), people = $('people');
  var chips = document.querySelectorAll('.chip');
  var tipMode = '5';

  var fmt = new Intl.NumberFormat('en-IN', {
    style: 'currency', currency: 'INR',
    minimumFractionDigits: 2, maximumFractionDigits: 2
  });

  function num(s) {
    var n = parseFloat(String(s).replace(/[^0-9.]/g, ''));
    return isFinite(n) ? n : 0;
  }
  function cleanDecimal(el) {
    var v = el.value.replace(/[^0-9.]/g, '');
    var i = v.indexOf('.');
    if (i !== -1) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/\./g, '').slice(0, 2);
    if (v.length > 9) v = v.slice(0, 9);
    el.value = v;
  }
  function getPeople() {
    var n = parseInt(people.value.replace(/\D/g, ''), 10);
    return n >= 1 ? Math.min(n, 99) : 1;
  }

  function calc() {
    var b = num(bill.value);
    var pct = tipMode === 'custom' ? Math.min(num(custom.value), 100) : Number(tipMode);
    var n = getPeople();
    var tip = Math.round(b * pct) / 100;
    var total = b + tip;
    var each = Math.ceil(total / n * 100 - 1e-9) / 100;

    $('perPerson').textContent = fmt.format(each);
    $('outBill').textContent = fmt.format(b);
    $('outTip').textContent = fmt.format(tip);
    $('outTotal').textContent = fmt.format(total);
    $('tipName').textContent = 'Tip (' + (Math.round(pct * 100) / 100) + '%)';
    $('perNote').textContent = n > 1 && b > 0 ? 'Split between ' + n + ' people' : '';
  }

  bill.addEventListener('input', function () { cleanDecimal(bill); calc(); });
  custom.addEventListener('input', function () { cleanDecimal(custom); calc(); });
  people.addEventListener('input', function () {
    people.value = people.value.replace(/\D/g, '').slice(0, 2);
    calc();
  });
  people.addEventListener('blur', function () { people.value = getPeople(); calc(); });

  $('minus').addEventListener('click', function () {
    people.value = Math.max(1, getPeople() - 1); calc();
  });
  $('plus').addEventListener('click', function () {
    people.value = Math.min(99, getPeople() + 1); calc();
  });

  chips.forEach(function (c) {
    c.addEventListener('click', function () {
      tipMode = c.getAttribute('data-tip');
      chips.forEach(function (x) { x.setAttribute('aria-pressed', x === c ? 'true' : 'false'); });
      $('customWrap').classList.toggle('show', tipMode === 'custom');
      if (tipMode === 'custom') custom.focus();
      calc();
    });
  });

  $('reset').addEventListener('click', function () {
    bill.value = ''; custom.value = ''; people.value = 2; tipMode = '5';
    chips.forEach(function (x) { x.setAttribute('aria-pressed', x.getAttribute('data-tip') === '5' ? 'true' : 'false'); });
    $('customWrap').classList.remove('show');
    calc();
    bill.focus();
  });

  calc();
})();
</script>
</body>
</html>
